name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell validator
        shell: pwsh
        run: pwsh skills/human-ai/scripts/validate.ps1 -Verbose
      - name: Run Bash validator
        run: bash skills/human-ai/scripts/validate.sh --verbose
      - name: Check SKILL.md self-containment
        shell: pwsh
        run: |
          $content = Get-Content skills/human-ai/SKILL.md -Raw
          if ($content -match "raw.githubusercontent.com") { Write-Error "FAIL: GitHub raw URLs present"; exit 1 }
          if ($content -match "Top burned words") { Write-Host "PASS: Embedded burned words" } else { Write-Error "FAIL: Missing embedded burned words"; exit 1 }
      - name: Verify runtime scripts
        shell: pwsh
        run: |
          $scripts = @("morph-check.ps1","readability-check.ps1","run-eval.ps1","clause-check.ps1","run-benchmark.sh","validate.ps1","validate.sh")
          $missing = @()
          foreach ($s in $scripts) { if (-not (Test-Path "skills/human-ai/scripts/$s")) { $missing += $s } }
          if ($missing.Count -gt 0) { Write-Error ("MISSING: " + ($missing -join ", ")); exit 1 }
          Write-Host "PASS: all runtime scripts present"
